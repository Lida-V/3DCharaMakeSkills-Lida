<rect x="40" y="789" width="1420" height="271" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
<text x="65" y="842" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#182d45">新位置 = 元位置 + マスク値 × 移動量</text>
<text x="65" y="889" font-family="Meiryo, sans-serif" font-size="24" font-weight="400" fill="#182d45">1  移動軸と単位を決める。中心は1、保持部分は0。必要な輪郭を保つ。</text>
<text x="65" y="933" font-family="Meiryo, sans-serif" font-size="24" font-weight="400" fill="#182d45">2  境目の折れは、量・戻す幅・面の配置を分けて調整。広げすぎも避ける。</text>
<text x="65" y="977" font-family="Meiryo, sans-serif" font-size="24" font-weight="400" fill="#182d45">3  細分化・拘束・キー反映後の実変位も測る。指定幅と実際の影響範囲は別。</text>
<text x="65" y="1021" font-family="Meiryo, sans-serif" font-size="24" font-weight="400" fill="#182d45">4  通常・途中・必要な最大・戻りと、隣の部品を確認してから採否を決める。</text>
<text x="42" y="1101" font-family="Meiryo, sans-serif" font-size="21" font-weight="400" fill="#82909f">灰の破線 = 修正前  ／  青の実線 = 修正後の例  ／  緑の点 = 固定位置  ／  橙 = マスク・移動量</text>

