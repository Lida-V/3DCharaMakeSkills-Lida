<text x="97" y="1034" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#c44957">8辺が1頂点へ集まる例。</text>
<text x="97" y="1079" font-family="Meiryo, sans-serif" font-size="27" font-weight="400" fill="#182d45">この集中箇所がつぶれ・ひだを作らないか確認。</text>
<text x="1267" y="1034" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#258c71">帯内は、辺の流れと面の大きさを揃える。</text>
<text x="1267" y="1079" font-family="Meiryo, sans-serif" font-size="27" font-weight="400" fill="#182d45">帯外で密度を移行。極は実際の動作で評価する。</text>
<text x="70" y="1250" font-family="Meiryo, sans-serif" font-size="30" font-weight="700" fill="#182d45">黄の帯＝想定する最大変形域   赤の面＝扇状接続   ●＝頂点   線＝辺</text>
<text x="70" y="1313" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">避けたいのは、強く変形する場所の接続集中・極端な細長い面・急な密度変化。三角面そのものを禁止しません。</text>
<text x="70" y="1365" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">連続した四角格子は流れを設計しやすい一例です。四角面だけでも、曲率・関節位置・ウェイトが不適切なら破綻します。</text>
<text x="70" y="1417" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">肩・脇・股は多方向に動くため、この一枚の平面格子では足りません。複合姿勢と途中角度で再検査してください。</text>
<text x="70" y="1466" font-family="Meiryo, sans-serif" font-size="26" font-weight="400" fill="#182d45">接続の確認：各扇状パッチは8三角面。格子の辺と頂点を共有し、重複面・独立した重なり面はありません。</text>
</svg>