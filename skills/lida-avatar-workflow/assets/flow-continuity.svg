<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1550" viewBox="0 0 2400 1550">
<rect width="2400" height="1550" fill="#f3f6fa"/>
<text x="60" y="102" font-family="Meiryo, sans-serif" font-size="57" font-weight="700" fill="#182d45">02  最大変形帯で、面と辺の流れを途切れさせない</text>
<text x="62" y="155" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">模式図｜表面パッチを平面に展開した接続例。実メッシュでは立体の曲率・変形方向に合わせて配置します。</text>
<rect x="60" y="220" width="1110" height="950" rx="24" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
<text x="90" y="285" font-family="Meiryo, sans-serif" font-size="35" font-weight="700" fill="#c44957">再検討する例：変形帯に接続が集中</text>
<text x="90" y="343" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">扇状の中心が、圧縮・伸長を受ける帯内にある</text>
<rect x="1230" y="220" width="1110" height="950" rx="24" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
<text x="1260" y="285" font-family="Meiryo, sans-serif" font-size="35" font-weight="700" fill="#258c71">設計例：連続した面の帯を確保</text>
<text x="1260" y="343" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">極や接続の切替を、変形の小さい位置へ置く</text>
<text x="472" y="409" font-family="Meiryo, sans-serif" font-size="30" font-weight="700" fill="#e99135">最大変形帯</text>
<text x="1780" y="409" font-family="Meiryo, sans-serif" font-size="30" font-weight="700" fill="#e99135">最大変形帯</text>
