<text x="166" y="639" font-size="18" fill="#576879">破線＝キー0の唇の位置</text>
<path d="M153 681 Q187 708 249 716 Q341 738 435 716 Q493 708 532 681" fill="none" stroke="#74818d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<text x="192" y="745" font-size="19" fill="#74818d" font-weight="700">顎輪郭は位置を変えない</text>
<circle cx="646" cy="429" r="15" fill="#147cac"/>
<text x="640" y="436" font-size="19" fill="#fff" font-weight="700">1</text>
<text x="673" y="436" font-size="23" fill="#147cac" font-weight="700">変える：唇・口角・必要な口内</text>
<text x="647" y="468" font-size="20">縁と隣接面を連続して動かす。</text>
<circle cx="646" cy="515" r="15" fill="#b96506"/>
<text x="640" y="522" font-size="19" fill="#fff" font-weight="700">2</text>
<text x="673" y="522" font-size="23" fill="#b96506" font-weight="700">戻す帯：動きを滑らかに0へ</text>
<text x="647" y="554" font-size="20">境界へ近づくほど変位を弱める。</text>
<circle cx="646" cy="601" r="15" fill="#74818d"/>
<text x="640" y="608" font-size="19" fill="#fff" font-weight="700">3</text>
<text x="673" y="608" font-size="23" fill="#74818d" font-weight="700">固定：境界の外・顎・顔の輪郭</text>
<text x="647" y="640" font-size="20">顎骨の回転・移動も0にする。</text>
<text x="647" y="680" font-size="20" fill="#19334a" font-weight="700">「顎骨0」だけでは不十分。</text>
<text x="647" y="711" font-size="20">顎輪郭の頂点と対象外の変位も測る。</text>
<rect x="35" y="789" width="1130" height="167" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<text x="60" y="824" font-size="22" font-weight="700">確認：キー0 → 途中 → 1、単独 → 組み合わせ → 保存して開き直す</text>
<ellipse cx="157" cy="870" rx="55" ry="3" fill="#e1f2fa" stroke="#147cac" stroke-width="3"/>
<text x="102" y="929" font-size="19">0：通常</text>
<ellipse cx="354" cy="870" rx="55" ry="13" fill="#e1f2fa" stroke="#147cac" stroke-width="3"/>
<text x="299" y="929" font-size="19">途中</text>
<ellipse cx="551" cy="870" rx="55" ry="28" fill="#e1f2fa" stroke="#147cac" stroke-width="3"/>
<text x="496" y="929" font-size="19">1：指定口型</text>
<path d="M230 872 H279" fill="none" stroke="#19334a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M427 872 H476" fill="none" stroke="#19334a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="695" y="864" font-size="20">母音同士・口＋瞬きなどを確認。</text>
<text x="695" y="899" font-size="20">正面・横・斜め、拡大と無地で見る。</text>
<text x="695" y="932" font-size="19">合計値の規則は使うキーに合わせる。</text>
<text x="38" y="997" font-size="19" fill="#576879">読み方：青＋実線＝対象部位 ／ 橙＋面の帯＝減衰 ／ 灰＋破線の顎＝保持</text>
<text x="38" y="1028" font-size="19" fill="#576879">目や感情のキーも同じ手順。変える部位・固定する部位はキーごとに指定する。</text>
</g>
</svg>
