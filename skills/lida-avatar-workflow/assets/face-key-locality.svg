<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">同じ基準メッシュで、対象部位だけの表情キーを作る</title><desc id="desc">口の局所パッチを使い、参考形状と頂点転写を区別する。口周辺の変位、外側の減衰、顎輪郭と対象外の固定、途中と組み合わせの検査を示す自作模式図。</desc>
<rect width="1200" height="1050" fill="#f4f7fb"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#19334a"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147cac"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c34251"/></marker></defs>
<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#19334a">
<text x="38" y="49" font-size="32" font-weight="700">同じ基準メッシュで、対象部位だけ動かす</text>
<text x="38" y="82" font-size="19" fill="#576879">模式図：口元だけを示す。完成した実メッシュや必要な列数を示す図ではありません。</text>
<rect x="35" y="112" width="330" height="176" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<rect x="435" y="112" width="330" height="176" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
