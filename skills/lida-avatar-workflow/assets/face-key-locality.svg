<circle cx="62" cy="142" r="15" fill="#19334a"/>
<text x="56" y="149" font-size="19" fill="#fff" font-weight="700">1</text>
<text x="88" y="149" font-size="22" font-weight="700">同じ通常顔の資料</text>
<ellipse cx="197" cy="192" rx="54" ry="4" fill="none" stroke="#19334a" stroke-width="3"/>
<text x="58" y="253" font-size="18">通常顔・口型・目／表情の画像</text>
<circle cx="462" cy="142" r="15" fill="#19334a"/>
<text x="456" y="149" font-size="19" fill="#fff" font-weight="700">2</text>
<text x="488" y="149" font-size="22" font-weight="700">Tripoの参考モデル</text>
<ellipse cx="500" cy="198" rx="25" ry="14" fill="none" stroke="#147cac" stroke-width="3"/>
<ellipse cx="595" cy="198" rx="30" ry="6" fill="none" stroke="#147cac" stroke-width="3"/>
<ellipse cx="690" cy="198" rx="18" ry="22" fill="none" stroke="#147cac" stroke-width="3"/>
<text x="460" y="250" font-size="18">幅・開き・突き出しを参考にする</text>
<circle cx="862" cy="142" r="15" fill="#19334a"/>
<text x="856" y="149" font-size="19" fill="#fff" font-weight="700">3</text>
<text x="888" y="149" font-size="22" font-weight="700">一つの基準メッシュ</text>
<ellipse cx="1000" cy="191" rx="50" ry="18" fill="#e1f2fa" stroke="#147cac" stroke-width="3"/>
<text x="860" y="248" font-size="18">対象部位だけのキーを作る</text>
