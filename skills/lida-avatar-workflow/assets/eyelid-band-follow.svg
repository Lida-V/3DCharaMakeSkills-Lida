<text x="306" y="226" font-size="18" fill="#c34251" font-weight="700">白い内側が見える例</text>
<path d="M159 309 L164 276" fill="none" stroke="#147cac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<path d="M159 386 L171 414" fill="none" stroke="#c34251" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/>
<text x="60" y="526" font-size="19" fill="#c34251" font-weight="700">連結面がねじれ、折れや隙間ができる。</text>
<text x="60" y="562" font-size="18">白線は材質・法線・内壁も切り分けて調べる。</text>
<circle cx="1112" cy="323" r="15" fill="#147cac"/>
<text x="1106" y="330" font-size="19" fill="#fff" font-weight="700">1</text>
<circle cx="1112" cy="372" r="15" fill="#147cac"/>
<text x="1106" y="379" font-size="19" fill="#fff" font-weight="700">1</text>
<circle cx="1112" cy="423" r="15" fill="#b96506"/>
<text x="1106" y="430" font-size="19" fill="#fff" font-weight="700">2</text>
<circle cx="1112" cy="478" r="15" fill="#74818d"/>
<text x="1106" y="485" font-size="19" fill="#fff" font-weight="700">3</text>
<path d="M1015 340 H1091" fill="none" stroke="#147cac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1015 380 H1091" fill="none" stroke="#147cac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1015 425 H1091" fill="none" stroke="#b96506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1015 477 H1091" fill="none" stroke="#74818d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="650" y="234" font-size="20" fill="#147cac" font-weight="700">1：縁と第1列＝同じ局所変換</text>
<text x="650" y="264" font-size="18">共有する量：軸位置・回転角・半径の変化</text>
<text x="650" y="526" font-size="20" fill="#b96506" font-weight="700">2：外側は追従を弱める → 3：変位0</text>
<text x="650" y="562" font-size="18">同じ変換でも、各頂点の移動ベクトルは異なる。</text>
<rect x="35" y="623" width="1130" height="273" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<text x="60" y="661" font-size="24" font-weight="700">3  指示する方向を分ける</text>
<text x="60" y="692" font-size="18" fill="#576879">側面断面での局所座標の説明図</text>
<circle cx="280" cy="787" r="60" fill="#f1f4f7" stroke="#9babb9" stroke-width="2"/>
<text x="250" y="795" font-size="19" fill="#576879">眼球</text>
<path d="M239 731 Q279 711 320 742" fill="none" stroke="#147cac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M177 823 V727" fill="none" stroke="#19334a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="95" y="714" font-size="19" font-weight="700">局所上</text>
<path d="M183 854 H324" fill="none" stroke="#19334a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="172" y="884" font-size="18" font-weight="700">局所奥行き</text>
<path d="M353 766 Q371 809 329 835" fill="none" stroke="#147cac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="375" y="803" font-size="19" fill="#147cac" font-weight="700">周方向</text>
<text x="543" y="720" font-size="22" font-weight="700">下縁の到達位置は「局所上」で合わせる。</text>
<text x="543" y="760" font-size="20">周方向の回転は、眼球中心と軸を指定する。</text>
<text x="543" y="800" font-size="20" fill="#c34251">眼球や下縁を一律に奥へ押す操作ではない。</text>
<text x="543" y="849" font-size="20">画像上の上下と、3Dの局所軸を対応づける。</text>
<rect x="35" y="919" width="1130" height="99" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<text x="60" y="954" font-size="21" font-weight="700">検査：左右別々に、0・途中・1と瞬き＋表情を拡大して確認する。</text>
<text x="60" y="991" font-size="20">怪しい途中値を細かく見る。縁・隣接列・内壁・眉、材質と無地を比較する。</text>
<text x="38" y="1056" font-size="19" fill="#576879">青＋1＝連動する帯 ／ 橙＋2＝減衰帯 ／ 灰破線＋3＝固定 ／ 赤＝動きの不一致</text>
</g>
</svg>
