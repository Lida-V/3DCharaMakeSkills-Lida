<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">まぶたは縁と隣接する面を一体で動かす</title><desc id="desc">縁と次の面列で局所的な動きが違うと接続面がねじれ白い内側が露出しうる。縁と第一隣接列に同じ軸位置、回転角、半径変化を与え外側へ減衰する。上、奥行き、周方向を区別する模式図。</desc>
<rect width="1200" height="1080" fill="#f4f7fb"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#19334a"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#147cac"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c34251"/></marker></defs>
<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#19334a">
<text x="38" y="49" font-size="32" font-weight="700">まぶたは「縁と隣の面」を一体で動かす</text>
<text x="38" y="82" font-size="19" fill="#576879">模式図：動いている途中の局所パッチ。列数や形は、実メッシュで決め直します。</text>
<rect x="35" y="112" width="540" height="486" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<rect x="625" y="112" width="540" height="486" rx="14" fill="#ffffff" stroke="#d5e0eb"/>
<text x="60" y="149" font-size="22" fill="#c34251" font-weight="700">1  つまずく例：動きのルールが別々</text>
<text x="650" y="149" font-size="22" fill="#197c68" font-weight="700">2  設計の要点：同じ局所変換を共有</text>
<text x="60" y="184" font-size="18">縁だけ閉じて、次の列を別方向へ補正する。</text>
<text x="650" y="184" font-size="18">縁と第1列が連動し、外側へ徐々に戻す。</text>
