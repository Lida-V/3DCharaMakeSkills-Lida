<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1190" viewBox="0 0 1500 1190">
<rect width="1500" height="1190" fill="#f3f6fa"/>
<text x="38" y="66" font-family="Meiryo, sans-serif" font-size="36" font-weight="700" fill="#182d45">素材は、同じ基準から用途ごとに分ける</text>
<text x="38" y="110" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#82909f">模式図：素材の関係を示す。生成画像や実モデルの比較図ではありません。</text>
<text x="40" y="174" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#258c71">1  身体と衣装：共通の姿勢・縮尺・目印を保持</text>
<rect x="40" y="197" width="330" height="313" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
