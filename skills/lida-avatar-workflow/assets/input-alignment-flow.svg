<text x="432" y="740" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">正面・斜め・横・下など</text>
<text x="432" y="776" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">頬・顎下・頭蓋を見る</text>
