<rect x="1150" y="650" width="310" height="184" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
<text x="1172" y="698" font-family="Meiryo, sans-serif" font-size="26" font-weight="700" fill="#182d45">粗い3D</text>
<text x="1172" y="740" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">無地で複数方向を確認</text>
<text x="1172" y="776" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">通常顔を決めて表情へ</text>
<polyline points="190.00,846.00 190.00,910.00" fill="none" stroke="#247bb8" stroke-width="3" stroke-linejoin="round"/>
<polygon points="190.00,910.00 197.00,892.00 183.00,892.00" fill="#247bb8" stroke="none" stroke-width="2"/>
<polyline points="190.00,910.00 935.00,910.00" fill="none" stroke="#247bb8" stroke-width="3" stroke-linejoin="round"/>
<polyline points="935.00,910.00 935.00,846.00" fill="none" stroke="#247bb8" stroke-width="3" stroke-linejoin="round"/>
<polygon points="935.00,846.00 928.00,864.00 942.00,864.00" fill="#247bb8" stroke="none" stroke-width="2"/>
<text x="270" y="948" font-family="Meiryo, sans-serif" font-size="24" font-weight="700" fill="#247bb8">三面図には、基準絵と角度資料の両方を渡す</text>
<rect x="40" y="980" width="1420" height="168" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
<text x="65" y="1032" font-family="Meiryo, sans-serif" font-size="27" font-weight="700" fill="#182d45">最初にそろえる：表情・縮尺・透視・高さの目印・前後の厚み</text>
<text x="65" y="1077" font-family="Meiryo, sans-serif" font-size="23" font-weight="400" fill="#182d45">顔の丸み改善は今回の制作経験。角度資料だけの効果として断定しません。</text>
<text x="65" y="1118" font-family="Meiryo, sans-serif" font-size="23" font-weight="400" fill="#182d45">三面図は厳密な投影ではないため、出力後に目印を照合して直します。</text>
</svg>