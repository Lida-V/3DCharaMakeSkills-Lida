<text x="62" y="287" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">顔・頭身・衣装を決める</text>
<text x="62" y="323" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">全身の目印を記録する</text>
