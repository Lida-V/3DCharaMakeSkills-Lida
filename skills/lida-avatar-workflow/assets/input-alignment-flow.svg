<text x="62" y="419" font-family="Meiryo, sans-serif" font-size="23" font-weight="400" fill="#247bb8">頭頂・肩・股・足など</text>
<text x="62" y="457" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">目印の定義をそろえる</text>
<text x="40" y="564" font-family="Meiryo, sans-serif" font-size="22" font-weight="700" fill="#c44957">段階別の生成は次回の予防案。独立した全身3体を重ねる手順ではありません。</text>
<text x="40" y="624" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#258c71">2  顔の立体：角度資料を先に作り、三面図へ整理</text>
<rect x="40" y="650" width="310" height="184" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
<text x="62" y="698" font-family="Meiryo, sans-serif" font-size="26" font-weight="700" fill="#182d45">基準絵</text>
<text x="62" y="740" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">同じ顔立ち・通常表情</text>
<text x="62" y="776" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">輪郭と比率を固定</text>
<polyline points="362.00,744.00 399.00,744.00" fill="none" stroke="#182d45" stroke-width="3" stroke-linejoin="round"/>
<polygon points="399.00,744.00 381.00,737.00 381.00,751.00" fill="#182d45" stroke="none" stroke-width="2"/>
<rect x="410" y="650" width="310" height="184" rx="14" fill="#ffffff" stroke="#d9e3ed" stroke-width="2"/>
