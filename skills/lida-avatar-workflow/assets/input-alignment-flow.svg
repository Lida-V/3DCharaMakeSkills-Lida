<text x="802" y="740" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">正面・側面・背面を構成</text>
<text x="802" y="776" font-family="Meiryo, sans-serif" font-size="22" font-weight="400" fill="#182d45">高さ・奥行き・縮尺を照合</text>
