<path d="M 813.2 1376.0 L 850 1523.2" fill="none" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 886.8 1376.0 L 850 1523.2" fill="none" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1093.25 1422.0 L 1131.2 1376.0 L 1204.8 1376.0 L 1242.75 1422.0 L 1168 1523.2 Z" fill="#8dc2d2" stroke="#536d82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1093.25 1422.0 L 1242.75 1422.0" fill="none" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1131.2 1376.0 L 1168 1523.2" fill="none" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1204.8 1376.0 L 1168 1523.2" fill="none" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 958 1445 L 1055 1445" fill="none" stroke="#357da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1055 1445 L 1039.0 1438.0 L 1039.0 1452.0 Z" fill="#357da5" stroke="#357da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718" y="1601" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">割当を確かめてから透過方式を比較。</text>
<text x="718" y="1646" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">PBRの透過・コートは対応時のみ。</text>
<text x="718" y="1691" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">AngelToonの不透明な擬似表現とは別。</text>
<text x="718" y="1736" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">透明化だけで宝石の質感を決めない。</text>
<text x="1368" y="1304" font-family="Meiryo,sans-serif" font-size="28" font-weight="700" fill="#20384e">細い装飾：黒い塊に見える</text>
<path d="M 1453.7 1428.6 L 1480.76 1395.8 L 1533.24 1395.8 L 1560.3 1428.6 L 1507 1500.76 Z" fill="#c8d8e0" stroke="#20384e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1453.7 1428.6 L 1560.3 1428.6" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1480.76 1395.8 L 1507 1500.76" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1533.24 1395.8 L 1507 1500.76" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1761.7 1428.6 L 1788.76 1395.8 L 1841.24 1395.8 L 1868.3 1428.6 L 1815 1500.76 Z" fill="#c8d8e0" stroke="#20384e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1761.7 1428.6 L 1868.3 1428.6" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1788.76 1395.8 L 1815 1500.76" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1841.24 1395.8 L 1815 1500.76" fill="none" stroke="#20384e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1600 1445 L 1720 1445" fill="none" stroke="#357da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1720 1445 L 1704.0 1438.0 L 1704.0 1452.0 Z" fill="#357da5" stroke="#357da5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1368" y="1601" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">輪郭線なし → 幅・色・対象を比較。</text>
<text x="1368" y="1646" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">形が薄すぎる／面が重なる場合は</text>
<text x="1368" y="1691" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">法線や厚みの問題も別に確認。</text>
<text x="1368" y="1736" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">全身の輪郭線を一括で細くしない。</text>
<rect x="40" y="1870" width="1920" height="480" rx="18" fill="#edf6f2" stroke="#c9e3d7" stroke-width="2"/>
<text x="70" y="1928" font-family="Meiryo,sans-serif" font-size="32" font-weight="700" fill="#168370">変更する順番と終了条件</text>
<text x="70" y="1992" font-family="Meiryo,sans-serif" font-size="29" font-weight="400" fill="#20384e">① 共通条件 → ② 割当と画像設定 → ③ 材質を一項目ずつ → ④ 必要なら形・UV・画像へ戻る。</text>
<text x="70" y="2050" font-family="Meiryo,sans-serif" font-size="29" font-weight="400" fill="#20384e">⑤ 寄りと全身、光の違う向きで比較し、同じ材質を使う他の部品へ悪化がないか確認。</text>
<text x="70" y="2108" font-family="Meiryo,sans-serif" font-size="29" font-weight="400" fill="#20384e">⑥ 保存・再読込・書き出し先で再確認。使用先にない機能は、対応表現または焼き込みを検討。</text>
<text x="70" y="2213" font-family="Meiryo,sans-serif" font-size="28" font-weight="700" fill="#20384e">記録するもの：入力版／対象面・材質／変更前後の値／比較画像／共有先／未確認項目</text>
<text x="70" y="2285" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">色だけで隠さず、原因と確認できた範囲を記録する。図の右側の絵は品質保証ではありません。</text>
<text x="50" y="2428" font-family="Meiryo,sans-serif" font-size="28" font-weight="700" fill="#20384e">M1＝割当・画像設定・UV　M2＝材質と共有先　M3＝形・法線</text>
