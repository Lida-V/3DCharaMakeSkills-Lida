<text x="60" y="103" font-family="Meiryo, sans-serif" font-size="58" font-weight="700" fill="#182d45">01  曲げる場所に、連続した支持帯をつくる</text>
<text x="62" y="156" font-family="Meiryo, sans-serif" font-size="29" font-weight="400" fill="#182d45">模式図｜単純な一方向関節を側面に投影。人体の立体形状や完成した変形を示す図ではありません。</text>
