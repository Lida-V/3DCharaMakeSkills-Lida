<text x="1540" y="1468" font-family="Meiryo, sans-serif" font-size="28" font-weight="400" fill="#182d45">色の推移＝ウェイトの切替</text>
<text x="70" y="1549" font-family="Meiryo, sans-serif" font-size="29" font-weight="400" fill="#182d45">本数・幅・重みは説明例。支持列を増やすだけで、へこみ・体積減少・貫通が解決するとは限りません。</text>
<text x="70" y="1599" font-family="Meiryo, sans-serif" font-size="27" font-weight="400" fill="#182d45">輪＝表面を一周する閉じた列の側面投影。肩・股は多方向に動くため、この配置をそのまま当てはめません。</text>
