<path d="M 1455 1512 L 1469.974580110516 1520.9867652975774 L 1471.7631918345382 1507.1014900716161 Z" fill="#536d82" stroke="#536d82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1740" y="1650" font-family="Meiryo,sans-serif" font-size="25" font-weight="700" fill="#20384e">掌側へ</text>
<path d="M 1730 1645 L 1645 1645" fill="none" stroke="#536d82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1645 1645 L 1661.0 1652.0 L 1661.0 1638.0 Z" fill="#536d82" stroke="#536d82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="1740" width="1920" height="450" rx="18" fill="white" stroke="#d6e0eb" stroke-width="2"/>
<text x="75" y="1798" font-family="Meiryo,sans-serif" font-size="34" font-weight="700" fill="#20384e">読み違えを防ぐ確認</text>
<text x="75" y="1856" font-family="Meiryo,sans-serif" font-size="30" font-weight="400" fill="#20384e">① 指は4本＋親指。親指の根元・爪の面・掌のふくらみで表裏をそろえる。</text>
<text x="75" y="1914" font-family="Meiryo,sans-serif" font-size="28" font-weight="400" fill="#20384e">② 関節位置と厚みを先に決め、曲がる帯へ連続する面を置く。辺を増やすだけで合格にしない。</text>
<text x="75" y="1972" font-family="Meiryo,sans-serif" font-size="28" font-weight="400" fill="#20384e">③ 指間や母指球の形を、一点への集中や急な密度差でつぶさない。面の流れを掌側まで追う。</text>
<text x="75" y="2030" font-family="Meiryo,sans-serif" font-size="29" font-weight="400" fill="#20384e">④ 甲・掌・側面・斜めを同じ基準で比較し、開いた手と曲げた手の両方で決める。</text>
<text x="75" y="2088" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">図の線は設計意図の説明です。万能な最適トポロジーや、この本数なら成功するという指定ではありません。</text>
<text x="75" y="2141" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">色の役割：青＝位置の目印　緑＝連続させる面／基準境界　橙＝付け根の並び／曲げ軸</text>
