<path d="M 475 1518 L 475 1423" fill="none" stroke="#d18a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 475 1423 L 468.0 1439.0 L 482.0 1439.0 Z" fill="#d18a2c" stroke="#d18a2c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="1560" font-family="Meiryo,sans-serif" font-size="27" font-weight="700" fill="#d18a2c">● 曲げ軸（紙面に垂直）</text>
<text x="73" y="1620" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">輪を一か所へ詰めず、圧縮・伸長する帯へ配分する。</text>
<text x="73" y="1663" font-family="Meiryo,sans-serif" font-size="26" font-weight="400" fill="#20384e">本数・間隔・斜めの流れは、曲げた結果で決める。</text>
<text x="1054" y="1156" font-family="Meiryo,sans-serif" font-size="30" font-weight="700" fill="#168370">C　親指の根元から、掌・隣指へつなぐ</text>
<text x="1054" y="1203" font-family="Meiryo,sans-serif" font-size="26" font-weight="400" fill="#20384e">指間付近だけを説明用に展開。厚みは省略。</text>
