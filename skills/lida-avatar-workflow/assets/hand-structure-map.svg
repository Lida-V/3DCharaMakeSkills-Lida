<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2410" viewBox="0 0 2000 2410" role="img" aria-labelledby="title desc">
<title id="title">手の構造：向き・比率・曲がる帯を先に決める</title><desc id="desc">自作模式図。同じ手を裏返した甲側と掌側、指関節周囲の輪、親指と人差し指の間から掌へ続く面の流れを説明する。実モデル、実測比率、最適な固定トポロジーではない。</desc>
<rect width="2000" height="2410" fill="#f3f6fa"/>
<text x="48" y="76" font-family="Meiryo,sans-serif" font-size="46" font-weight="700" fill="#20384e">手の構造：向き・比率・曲がる帯を先に決める</text>
<text x="50" y="126" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">自作模式図｜形と面の流れを読むための例。実メッシュ・固定の比率・推奨の輪の本数ではありません。</text>
<rect x="40" y="160" width="1920" height="910" rx="18" fill="white" stroke="#d6e0eb" stroke-width="2"/>
<text x="75" y="216" font-family="Meiryo,sans-serif" font-size="35" font-weight="700" fill="#168370">A　同じ手の甲と掌を、別の方向から確認</text>
<text x="175" y="274" font-family="Meiryo,sans-serif" font-size="31" font-weight="700" fill="#20384e">甲側：爪が見える</text>
<text x="1150" y="274" font-family="Meiryo,sans-serif" font-size="30" font-weight="700" fill="#20384e">掌側：裏返すと親指の左右も反転</text>
