<path d="M 82 960 L 162 960" fill="none" stroke="#357da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<text x="179" y="970" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">青破線：関節付近の位置の目印</text>
<path d="M 925 960 L 1005 960" fill="none" stroke="#d18a2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<text x="1022" y="970" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">橙破線：付け根の並びの目印</text>
<text x="78" y="1022" font-family="Meiryo,sans-serif" font-size="29" font-weight="400" fill="#20384e">掌と各指の長さ・厚み、付け根の弧は原画へ対応。左右反転だけで表裏を判定しない。</text>
<rect x="40" y="1100" width="950" height="610" rx="18" fill="white" stroke="#d6e0eb" stroke-width="2"/>
<rect x="1020" y="1100" width="940" height="610" rx="18" fill="white" stroke="#d6e0eb" stroke-width="2"/>
<text x="73" y="1156" font-family="Meiryo,sans-serif" font-size="31" font-weight="700" fill="#168370">B　曲げ軸の前後を、面の帯でつなぐ</text>
<text x="73" y="1203" font-family="Meiryo,sans-serif" font-size="26" font-weight="400" fill="#20384e">指の一部を拡大。甲側と掌側を含む輪の説明。</text>
