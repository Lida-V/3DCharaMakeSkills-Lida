<circle cx="145" cy="1320" r="9" fill="white" stroke="#aebfce" stroke-width="3"/>
<path d="M 242 1500 L 242 1420" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 242 1420 L 302 1390" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 302 1390 L 342 1420" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="242" cy="1500" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="242" cy="1420" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="302" cy="1390" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="342" cy="1420" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<path d="M 105 1540 L 385 1540" fill="none" stroke="#168370" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="1600" font-family="Meiryo,sans-serif" font-size="25" font-weight="700" fill="#20384e">隣指・掌は保つ。</text>
<text x="88" y="1645" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">内側のつぶれと、</text>
<text x="88" y="1687" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">外側の伸びを確認。</text>
<text x="568" y="1290" font-family="Meiryo,sans-serif" font-size="27" font-weight="700" fill="#20384e">② 親指を対向させる</text>
<path d="M650 1530 Q625 1460 670 1400 L820 1400 Q865 1460 840 1530 Z" fill="#e2edf5" stroke="#536d82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
