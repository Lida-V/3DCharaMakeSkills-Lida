<path d="M 675 1435 L 720 1380" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="680" cy="1490" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="675" cy="1435" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="720" cy="1380" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<path d="M 810 1410 L 810 1345" fill="none" stroke="#7e9db5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 810 1345 L 770 1330" fill="none" stroke="#7e9db5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 770 1330 L 735 1370" fill="none" stroke="#7e9db5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="810" cy="1410" r="9" fill="white" stroke="#7e9db5" stroke-width="3"/>
<circle cx="810" cy="1345" r="9" fill="white" stroke="#7e9db5" stroke-width="3"/>
<circle cx="770" cy="1330" r="9" fill="white" stroke="#7e9db5" stroke-width="3"/>
<circle cx="735" cy="1370" r="9" fill="white" stroke="#7e9db5" stroke-width="3"/>
<circle cx="728" cy="1374" r="17" fill="none" stroke="#d18a2c" stroke-width="4"/>
<text x="568" y="1600" font-family="Meiryo,sans-serif" font-size="25" font-weight="700" fill="#20384e">指先だけを寄せず、</text>
<text x="568" y="1645" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">母指球・指間の厚みと</text>
<text x="568" y="1687" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">根元の向きを確認。</text>
<text x="1048" y="1290" font-family="Meiryo,sans-serif" font-size="27" font-weight="700" fill="#20384e">③ 握る途中も見る</text>
<path d="M 1110 1500 L 1110 1410" fill="none" stroke="#bbc9d5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1110 1410 L 1110 1350" fill="none" stroke="#bbc9d5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1110 1350 L 1110 1325" fill="none" stroke="#bbc9d5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1110" cy="1500" r="9" fill="white" stroke="#bbc9d5" stroke-width="3"/>
<circle cx="1110" cy="1410" r="9" fill="white" stroke="#bbc9d5" stroke-width="3"/>
<circle cx="1110" cy="1350" r="9" fill="white" stroke="#bbc9d5" stroke-width="3"/>
<circle cx="1110" cy="1325" r="9" fill="white" stroke="#bbc9d5" stroke-width="3"/>
<path d="M 1193 1500 L 1200 1420" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1200 1420 L 1250 1385" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1250 1385 L 1290 1410" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1193" cy="1500" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1200" cy="1420" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1250" cy="1385" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1290" cy="1410" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<path d="M 1325 1500 L 1325 1440" fill="none" stroke="#829eb4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1325 1440 L 1360 1430" fill="none" stroke="#829eb4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1360 1430 L 1370 1465" fill="none" stroke="#829eb4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1325" cy="1500" r="9" fill="white" stroke="#829eb4" stroke-width="3"/>
<circle cx="1325" cy="1440" r="9" fill="white" stroke="#829eb4" stroke-width="3"/>
<circle cx="1360" cy="1430" r="9" fill="white" stroke="#829eb4" stroke-width="3"/>
<circle cx="1370" cy="1465" r="9" fill="white" stroke="#829eb4" stroke-width="3"/>
<text x="1048" y="1600" font-family="Meiryo,sans-serif" font-size="24" font-weight="700" fill="#20384e">途中で急に折れないか。</text>
<text x="1048" y="1645" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">爪と指先、指同士の</text>
<text x="1048" y="1687" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">接触も確認する。</text>
<text x="1528" y="1290" font-family="Meiryo,sans-serif" font-size="27" font-weight="700" fill="#20384e">④ 元へ戻す</text>
<path d="M 1610 1500 L 1610 1420" fill="none" stroke="#c7d4df" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1610 1420 L 1660 1385" fill="none" stroke="#c7d4df" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1660 1385 L 1700 1410" fill="none" stroke="#c7d4df" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1610" cy="1500" r="9" fill="white" stroke="#c7d4df" stroke-width="3"/>
<circle cx="1610" cy="1420" r="9" fill="white" stroke="#c7d4df" stroke-width="3"/>
<circle cx="1660" cy="1385" r="9" fill="white" stroke="#c7d4df" stroke-width="3"/>
<circle cx="1700" cy="1410" r="9" fill="white" stroke="#c7d4df" stroke-width="3"/>
<path d="M 1740 1500 L 1740 1420" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1740 1420 L 1740 1355" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1740 1355 L 1740 1325" fill="none" stroke="#357da5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1740" cy="1500" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1740" cy="1420" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1740" cy="1355" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<circle cx="1740" cy="1325" r="9" fill="white" stroke="#357da5" stroke-width="3"/>
<path d="M 1660 1515 L 1735 1440" fill="none" stroke="#168370" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1735 1440 L 1718.7365440327094 1446.363961030679 L 1728.636038969321 1456.2634559672906 Z" fill="#168370" stroke="#168370" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1528" y="1600" font-family="Meiryo,sans-serif" font-size="24" font-weight="700" fill="#20384e">基準姿勢との差を調べる。</text>
<text x="1528" y="1645" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">手首を回した時の</text>
<text x="1528" y="1687" font-family="Meiryo,sans-serif" font-size="25" font-weight="400" fill="#20384e">袖・装飾の追従も確認。</text>
<rect x="40" y="1830" width="1920" height="500" rx="18" fill="white" stroke="#d6e0eb" stroke-width="2"/>
<text x="75" y="1888" font-family="Meiryo,sans-serif" font-size="34" font-weight="700" fill="#20384e">AIへ渡すときは、保持部と確認画像をセットにする</text>
<path d="M 80 1940 L 150 1940" fill="none" stroke="#168370" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170" y="1950" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">緑：保持する境界／表面を追う経路</text>
<path d="M 1010 1940 L 1080 1940" fill="none" stroke="#bd4c5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1100" y="1950" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">赤：指間を飛び越える選択</text>
<text x="75" y="2014" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">依頼例：「人差し指の関節帯のみ調整。隣指・爪形状・手首境界は保持。表面の接続で範囲を指定。</text>
<text x="75" y="2060" font-family="Meiryo,sans-serif" font-size="26" font-weight="400" fill="#20384e">開いた手、単指の途中曲げ、親指対向、握り、基準へ戻した手を、甲・掌・側面から比較してください。」</text>
<text x="75" y="2126" font-family="Meiryo,sans-serif" font-size="28" font-weight="700" fill="#20384e">保持の意味を明記：形状を固定する部位と、骨へ追従させる爪・装飾は区別します。</text>
<text x="75" y="2184" font-family="Meiryo,sans-serif" font-size="28" font-weight="400" fill="#20384e">爪は指先の姿勢に追従し、板のような形を保つ。袖の硬い縁を手首へ一緒につぶさない。</text>
<text x="75" y="2242" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">保存後・書き出し先でも同じ姿勢を確認。平滑化や交差数だけで、見た目・動作の合格にしない。</text>
<text x="75" y="2294" font-family="Meiryo,sans-serif" font-size="27" font-weight="400" fill="#20384e">推奨の影響本数・減衰距離は固定しません。関節の構造と使用先の制約に合わせます。</text>
