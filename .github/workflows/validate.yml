name: Validate distribution pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the complete Skills package with its pinned reference model
        run: python scripts/build_package.py --fetch-reference-model
      - name: Validate documents and publication scope
        run: python scripts/validate.py
      - name: Check validator behavior
        run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v7
        with:
          name: 3DCharaMakeSkills-Lida-development
          path: dist/*
          retention-days: 30
          if-no-files-found: error
